name: AnalysisAndTest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analysis-and-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Analyze, test and assemble Android
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Static analysis
        run: ./gradlew detekt --stacktrace

      - name: Test and enforce coverage
        run: ./gradlew koverVerify --stacktrace

      - name: Verify migrations and assemble Android
        run: >
          ./gradlew
          :shared:data:verifySqlDelightMigration
          :shared:compose:compileAndroidMain
          :androidApp:assembleDebug
          --stacktrace

      - name: Upload analysis and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-analysis-and-test-reports
          path: |
            build/reports/detekt
            build/reports/kover
            shared/**/build/reports/tests
          if-no-files-found: ignore

  ios:
    name: Test and link iOS
    runs-on: macos-15
    steps:
      - name: Check out sources
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Resolve native iOS SDKs
        working-directory: iosApp
        run: pod install --repo-update

      - name: Test shared iOS modules and link framework
        run: >
          ./gradlew
          :shared:domain:iosSimulatorArm64Test
          :shared:data:iosSimulatorArm64Test
          :shared:platform:iosSimulatorArm64Test
          :shared:app:iosSimulatorArm64Test
          :shared:ads:iosSimulatorArm64Test
          :shared:compose:iosSimulatorArm64Test
          :shared:compose:linkDebugFrameworkIosSimulatorArm64
          --stacktrace

      - name: Upload iOS test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-reports
          path: shared/**/build/reports/tests
          if-no-files-found: ignore
