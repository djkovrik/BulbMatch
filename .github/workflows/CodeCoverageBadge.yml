name: CodeCoverageBadge

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-coverage-badge-master
  cancel-in-progress: true

jobs:
  badge:
    name: Publish code coverage badge
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Calculate line coverage
        shell: bash
        run: |
          coverage="$(./gradlew -q printLineCoverage | tail -n 1)"
          if [[ ! "$coverage" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
            echo "Unexpected coverage output: $coverage" >&2
            exit 1
          fi
          echo "COVERAGE=$coverage" >> "$GITHUB_ENV"

      - name: Print line coverage
        run: echo "Line coverage is ${{ env.COVERAGE }}%"

      - name: Update dynamic badge gist
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: bulbmatch-coverage-badge.json
          label: coverage
          message: ${{ env.COVERAGE }}%
          valColorRange: ${{ env.COVERAGE }}
          minColorRange: 0
          maxColorRange: 100
