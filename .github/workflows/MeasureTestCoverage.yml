name: MeasureTestCoverage

on:
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: measure-test-coverage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Measure changed-code coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Generate Kover XML report
        run: ./gradlew koverXmlReport --stacktrace

      - name: Add coverage report to pull request
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: mi-kas/kover-report@v2
        with:
          path: ${{ github.workspace }}/build/reports/kover/report.xml
          title: Code Coverage
          token: ${{ secrets.GITHUB_TOKEN }}
          update-comment: true
          min-coverage-overall: 70
          min-coverage-changed-files: 70
          coverage-counter-type: LINE

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kover-xml-report
          path: build/reports/kover/report.xml
          if-no-files-found: error
